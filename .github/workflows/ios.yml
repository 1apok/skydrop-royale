name: iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Decode signing files (optional)
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$PROFILE_BASE64" ]; then
            echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
            echo "IOS_P12=$RUNNER_TEMP/cert.p12" >> "$GITHUB_ENV"
            echo "IOS_PROFILE=$RUNNER_TEMP/profile.mobileprovision" >> "$GITHUB_ENV"
          fi

      - name: Build IPA
        env:
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: ./ios/build_ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SKYDROP-ipa
          path: out/*.ipa
          if-no-files-found: error
